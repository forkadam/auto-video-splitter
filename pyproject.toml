[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsplit"
version = "0.1.0"
description = "Local scene-aware video splitter with human-in-the-loop review"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scenedetect[opencv]>=0.6.4",
    "jinja2>=3.1",
    "rich>=13.7",
    "structlog>=24.1",
    "platformdirs>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
vsplit = "vsplit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vsplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
